<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Swift Client</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f12;
    --surface:#151a20;
    --surface-2:#1b222a;
    --surface-hover:#222a33;
    --border:#262e37;
    --border-soft:#1a2028;
    --text:#eef2f5;
    --text-dim:#9aa7b2;
    --text-faint:#5e6b76;
    --accent:#d8dde3;
    --accent-soft:rgba(216,221,227,0.09);
    --good:#8fd6a8;
    --good-bg:rgba(143,214,168,0.1);
    --bad:#e0958f;
    --bad-bg:rgba(224,149,143,0.1);
    --warn:#e0c88f;
    --warn-bg:rgba(224,200,143,0.1);
    --font-display:'Rajdhani','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Manrope','Segoe UI',sans-serif; padding:32px 20px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  h1{
    font-family:var(--font-display); font-weight:700; font-size:28px; margin:0 0 4px;
    letter-spacing:0.02em;
  }
  .subtitle{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
  .badge-preview{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--warn); background:var(--warn-bg);
    border:1px solid rgba(224,200,143,0.3); border-radius:999px; padding:3px 10px; margin-left:10px;
    vertical-align:middle;
  }

  .state-box{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:40px 24px; text-align:center; color:var(--text-dim); font-size:15px;
  }
  .state-box h2{color:var(--text);font-family:var(--font-display);font-size:20px;margin:0 0 10px;}
  .btn{
    font-family:inherit; font-weight:700; font-size:14px; border-radius:10px; border:1px solid var(--border);
    padding:11px 20px; cursor:pointer; background:var(--surface-2); color:var(--text);
  }
  .btn:hover{background:var(--surface-hover);}
  .btn-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:22px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .stat-num{font-family:var(--font-display); font-size:26px; font-weight:700;}
  .stat-label{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}

  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{
    font-family:inherit; font-size:13px; font-weight:600; color:var(--text-dim); background:var(--surface);
    border:1px solid var(--border); border-radius:999px; padding:7px 14px; cursor:pointer;
  }
  .tab.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:8px;
    width:32px; height:32px; cursor:pointer; font-size:15px;
  }
  .icon-btn:hover{color:var(--text); border-color:#33404b;}

  .list{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .card-info{flex:1; min-width:200px;}
  .card-name{font-weight:700; font-size:15px;}
  .card-meta{color:var(--text-dim); font-size:12.5px; margin-top:3px;}
  .status-pill{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    border-radius:999px; padding:3px 10px; margin-left:8px; vertical-align:middle;
  }
  .status-pending{color:var(--warn); background:var(--warn-bg);}
  .status-approved{color:var(--good); background:var(--good-bg);}
  .status-denied{color:var(--bad); background:var(--bad-bg);}
  .card-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .card-actions button{
    font-family:inherit; font-weight:700; font-size:12.5px; border-radius:8px; border:1px solid var(--border);
    padding:8px 14px; cursor:pointer;
  }
  .act-approve{background:var(--good-bg); color:var(--good);}
  .act-deny{background:var(--bad-bg); color:var(--bad);}
  .act-reset{background:var(--surface-2); color:var(--text-dim);}
  .empty{color:var(--text-faint); text-align:center; padding:40px 0; font-size:14px;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin Dashboard<span class="badge-preview">Vorläufig</span></h1>
  <p class="subtitle">Zugriffsanfragen für Swift Client verwalten</p>

  <div id="stateLoading" class="state-box"><h2>Lade…</h2></div>

  <div id="stateLoggedOut" class="state-box" hidden>
    <h2>Anmeldung erforderlich</h2>
    <p>Melde dich als Admin an, um Zugriffsanfragen zu verwalten.</p>
    <div class="btn-row">
      <button class="btn" id="loginDiscord">Mit Discord anmelden</button>
      <button class="btn" id="loginGoogle">Mit Google anmelden</button>
    </div>
  </div>

  <div id="stateNoAccess" class="state-box" hidden>
    <h2>Kein Zugriff</h2>
    <p>Dieses Konto ist nicht als Admin hinterlegt.</p>
    <div class="btn-row"><button class="btn" id="noAccessSignOut">Abmelden</button></div>
  </div>

  <div id="dashboard" hidden>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="statAll">0</div><div class="stat-label">Gesamt</div></div>
      <div class="stat"><div class="stat-num" id="statPending">0</div><div class="stat-label">Offen</div></div>
      <div class="stat"><div class="stat-num" id="statApproved">0</div><div class="stat-label">Angenommen</div></div>
      <div class="stat"><div class="stat-num" id="statDenied">0</div><div class="stat-label">Abgelehnt</div></div>
    </div>

    <div class="toolbar">
      <div class="tabs" id="filterTabs">
        <button class="tab active" data-filter="pending">Offen</button>
        <button class="tab" data-filter="approved">Angenommen</button>
        <button class="tab" data-filter="denied">Abgelehnt</button>
        <button class="tab" data-filter="all">Alle</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="icon-btn" id="refreshBtn" aria-label="Aktualisieren" title="Aktualisieren">↻</button>
        <button class="icon-btn" id="signOutBtn" aria-label="Abmelden" title="Abmelden">⏻</button>
      </div>
    </div>

    <div class="list" id="list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL = 'https://uarongskqlfkjqkxlvld.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_UXsraKrs0qVJeNlqV_Oslw_QqhdJ-8C';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var redirectUrl = window.location.origin + window.location.pathname;

  var ADMIN_EMAIL = 'l.kunzmann@mail.de';
  var ADMIN_USER_IDS = ['ebd388f0-4945-4abf-b4e4-9e0fa34bf338'];

  var stateLoading = document.getElementById('stateLoading');
  var stateLoggedOut = document.getElementById('stateLoggedOut');
  var stateNoAccess = document.getElementById('stateNoAccess');
  var dashboard = document.getElementById('dashboard');
  var listEl = document.getElementById('list');
  var currentFilter = 'pending';
  var allRows = [];

  function showState(which){
    [stateLoading, stateLoggedOut, stateNoAccess, dashboard].forEach(function(el){ el.hidden = true; });
    which.hidden = false;
  }

  function renderStats(rows){
    document.getElementById('statAll').textContent = rows.length;
    document.getElementById('statPending').textContent = rows.filter(function(r){return r.status==='pending';}).length;
    document.getElementById('statApproved').textContent = rows.filter(function(r){return r.status==='approved';}).length;
    document.getElementById('statDenied').textContent = rows.filter(function(r){return r.status==='denied';}).length;
  }

  function statusLabel(s){
    if(s === 'approved') return 'Angenommen';
    if(s === 'denied') return 'Abgelehnt';
    return 'Offen';
  }

  function renderCard(req){
    var card = document.createElement('div');
    card.className = 'card';

    var info = document.createElement('div');
    info.className = 'card-info';
    var name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = req.display_name ? req.display_name : req.email;
    var pill = document.createElement('span');
    pill.className = 'status-pill status-' + req.status;
    pill.textContent = statusLabel(req.status);
    name.appendChild(pill);
    info.appendChild(name);

    var meta = document.createElement('div');
    meta.className = 'card-meta';
    var date = new Date(req.created_at);
    meta.textContent = req.email + ' · ' + (req.provider || '-') + ' · ' + date.toLocaleString('de-DE');
    info.appendChild(meta);

    card.appendChild(info);

    var actions = document.createElement('div');
    actions.className = 'card-actions';

    function updateStatus(newStatus){
      sb.from('access_requests').update({status: newStatus, updated_at: new Date().toISOString()}).eq('id', req.id).then(function(){
        loadRequests();
      });
    }

    if(req.status !== 'approved'){
      var approveBtn = document.createElement('button');
      approveBtn.className = 'act-approve';
      approveBtn.textContent = 'Annehmen';
      approveBtn.addEventListener('click', function(){ updateStatus('approved'); });
      actions.appendChild(approveBtn);
    }
    if(req.status !== 'denied'){
      var denyBtn = document.createElement('button');
      denyBtn.className = 'act-deny';
      denyBtn.textContent = 'Ablehnen';
      denyBtn.addEventListener('click', function(){ updateStatus('denied'); });
      actions.appendChild(denyBtn);
    }
    if(req.status !== 'pending'){
      var resetBtn = document.createElement('button');
      resetBtn.className = 'act-reset';
      resetBtn.textContent = 'Zurücksetzen';
      resetBtn.addEventListener('click', function(){ updateStatus('pending'); });
      actions.appendChild(resetBtn);
    }
    card.appendChild(actions);

    return card;
  }

  function renderList(){
    listEl.innerHTML = '';
    var rows = currentFilter === 'all' ? allRows : allRows.filter(function(r){ return r.status === currentFilter; });
    if(!rows.length){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Keine Einträge.';
      listEl.appendChild(empty);
      return;
    }
    rows.forEach(function(req){ listEl.appendChild(renderCard(req)); });
  }

  function loadRequests(){
    sb.from('access_requests').select('*').order('created_at', {ascending:false}).then(function(res){
      allRows = res.data || [];
      renderStats(allRows);
      renderList();
    });
  }

  function checkAdmin(session){
    if(!session || !session.user){
      showState(stateLoggedOut);
      return;
    }
    var email = (session.user.email || '').toLowerCase();
    var isAdmin = email === ADMIN_EMAIL || ADMIN_USER_IDS.indexOf(session.user.id) !== -1;
    if(!isAdmin){
      showState(stateNoAccess);
      return;
    }
    showState(dashboard);
    loadRequests();
  }

  document.getElementById('loginDiscord').addEventListener('click', function(){
    sb.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: redirectUrl } });
  });
  document.getElementById('loginGoogle').addEventListener('click', function(){
    sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectUrl } });
  });
  document.getElementById('noAccessSignOut').addEventListener('click', function(){ sb.auth.signOut(); });
  document.getElementById('signOutBtn').addEventListener('click', function(){ sb.auth.signOut(); });
  document.getElementById('refreshBtn').addEventListener('click', loadRequests);

  document.getElementById('filterTabs').addEventListener('click', function(e){
    var btn = e.target.closest('.tab');
    if(!btn) return;
    currentFilter = btn.getAttribute('data-filter');
    document.querySelectorAll('#filterTabs .tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    renderList();
  });

  sb.auth.onAuthStateChange(function(_event, session){ checkAdmin(session); });
  sb.auth.getSession().then(function(res){ checkAdmin(res.data.session); });
})();
</script>
</body>
</html>
